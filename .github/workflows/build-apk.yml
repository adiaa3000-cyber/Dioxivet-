
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: test -f pubspec.yaml

      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name dioxivet_academy .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dioxivet-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
